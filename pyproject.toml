[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "naeco"
version = "0.1.0"
description = "ナショナルエコノミー(無印)の対戦AI: ルールエンジン・PPO自己対戦・ISMCTS探索・学習済み重み(非公式)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
# エンジン(Phase 1)は標準ライブラリのみ。学習(Phase 3)で torch 等を追加する。
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
train = [
  "filelock==3.19.1",
  "fsspec==2025.10.0",
  "Jinja2==3.1.6",
  "MarkupSafe==3.0.2",
  "mpmath==1.3.0",
  "networkx==3.2.1",
  "numpy==2.0.2",
  "sympy==1.14.0",
  "torch==2.8.0+cpu",
  "typing_extensions==4.15.0",
]

[tool.setuptools]
packages = ["naeco", "naeco.engine", "naeco.ai", "naeco.ai.eval", "naeco.ai.search", "naeco.train"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# サーバー(3.9)互換を CI の compileall と Ruff で検査する。

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
# Fatal syntax/logic errors and annotations requiring a newer interpreter.
# PEP 585 generics (list[int], etc.) already work on 3.9; FA102 rejects
# evaluated PEP 604 unions there. Do not enable UP rules that modernize typing.
select = ["E9", "F63", "F7", "F82", "FA102"]
